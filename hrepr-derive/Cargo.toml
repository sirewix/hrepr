[package]
name = "hrepr-derive"
description = "Derive macro for hrepr's Generic trait"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme.workspace = true
keywords = ["hlist", "generic", "derive", "representation", "reflection"]
categories = ["rust-patterns", "no-std"]
documentation = "https://docs.rs/hrepr-derive/latest"

[lib]
proc-macro = true
path = "lib.rs"

[dependencies]
proc-macro2 = "1.0.103"
quote = "1.0.42"
syn = "2.0.109"
